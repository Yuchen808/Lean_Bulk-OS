<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lean Bulk">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Lean Bulk OS</title>
<style>
:root{
  --paper:#f5f5f5;--card:#ffffff;--ink:#111111;--muted:#6b6b6b;--soft:#9a9a9a;
  --rule:rgba(0,0,0,.09);--rule2:rgba(0,0,0,.16);--accent:#e5352b;--fill:#111111;--onfill:#ffffff;
  --done:#111111;--ok:#1f8a3b;--okbg:rgba(31,138,59,.08);
}
@media (prefers-color-scheme: dark){
  :root{--paper:#0b0b0b;--card:#151515;--ink:#eaeaea;--muted:#a6a6a6;--soft:#8c8c8c;
  --rule:rgba(255,255,255,.08);--rule2:rgba(255,255,255,.16);--accent:#ff3b30;--fill:#eaeaea;--onfill:#0b0b0b;--done:#eaeaea;--ok:#34c759;--okbg:rgba(52,199,89,.12);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 84px);max-width:520px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.date{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:14px 14px;margin:0 0 12px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.mid{font-size:20px;font-weight:650}
.sub{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:0;margin-top:10px;border-top:1px solid var(--rule);padding-top:10px}
.stats>div+div{border-left:1px solid var(--rule);padding-left:12px}
input[type=number],input[type=text],select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--rule2);border-radius:8px;padding:9px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--ink);outline-offset:-1px}
#w.saved{border-color:var(--ok);background:var(--okbg);color:var(--ok);outline-color:var(--ok)}
.nut .r{align-items:center;gap:10px}
.nut .nm{flex:0 0 64px;white-space:nowrap}
.nut .bar{flex:1;margin-top:0}
.nut .v{flex:0 0 116px;text-align:right;white-space:nowrap;font-size:12.5px}
.nut .ok i{background:var(--ok)}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--rule2);border-radius:8px;padding:9px 12px;cursor:pointer}
button.solid{background:var(--fill);color:var(--onfill);border-color:var(--fill);font-weight:600}
button.ghost{border-color:transparent;color:var(--muted);padding:6px 8px}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;font-size:13px}
.seg button.on{background:var(--fill);color:var(--onfill)}
.meal{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.meal:first-of-type{border-top:0}
.chk{width:28px;height:28px;flex:0 0 28px;border-radius:50%;border:1.5px solid var(--rule2);display:grid;place-items:center;padding:0;background:transparent}
.chk.on{background:var(--done);border-color:var(--done)}
.chk.on::after{content:"";width:10px;height:6px;border:2px solid var(--onfill);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.meal .t{flex:1;min-width:0}
.meal .n{font-weight:600}
.meal .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal .p{font-size:13px;color:var(--muted);white-space:nowrap}
.bar{height:6px;background:var(--rule);border-radius:3px;overflow:hidden;margin-top:8px;position:relative}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.verdict{border-color:var(--accent)}
.verdict .lbl{color:var(--accent)}
.pill{display:inline-block;font-size:11px;padding:2px 7px;border:1px solid var(--rule2);border-radius:4px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{padding:6px 10px;font-size:13px}
.ex{padding:12px 0;border-top:1px solid var(--rule)}
.ex:first-of-type{border-top:0}
.ex .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ex .name{font-weight:600}
.ex .rng{font-size:12px;color:var(--muted);white-space:nowrap}
.ex .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.ex .hint.up{color:var(--ink);font-weight:600}
.step{display:flex;align-items:center;border:1px solid var(--rule2);border-radius:8px;overflow:hidden}
.step button{border:0;border-radius:0;padding:8px 11px;color:var(--muted)}
.step span{min-width:52px;text-align:center;font-weight:600}
.step input{width:58px;border:0;border-radius:0;text-align:center;font-weight:600;padding:8px 0}
.date.tap{cursor:pointer}.date.tap::after{content:' ▾';font-size:16px;color:var(--soft)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal button{position:relative;border:1px solid transparent;padding:10px 0;font-size:15px}
.cal button.today{border-color:var(--rule2)}
.cal button.tr{background:var(--okbg);border-color:rgba(31,138,59,.18);border-radius:8px}
.cal button.sel{background:var(--fill);color:var(--onfill);border-color:var(--fill)}
.cal button[disabled]{opacity:.3}
.cal .dot{position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.rest{text-align:center;padding:28px 10px}
.savedbox{width:100%;padding:13px;border:1.5px solid var(--ok);background:var(--okbg);color:var(--ok);border-radius:8px;text-align:center;font-weight:650}
.ctl{display:flex;align-items:center;gap:8px;margin-top:8px}
.x{color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--rule);display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav div{display:flex;width:100%;max-width:520px}
nav button{flex:1;border:0;font-size:12px;color:var(--soft);padding:8px 0}
nav button.on{color:var(--ink);font-weight:650}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet>div{background:var(--card);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:85vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
svg text{fill:var(--muted);font-size:10px}
.hidden{display:none}
.list{font-size:13.5px}
.list .r{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--rule)}
.list .r:first-child{border-top:0}
.foot{font-size:12px;color:var(--soft);margin-top:18px;text-align:center}
</style>
</head>
<body>
<main id="app"></main>
<nav><div>
  <button data-tab="today" class="on">今天</button>
  <button data-tab="train">训练</button>
  <button data-tab="trend">趋势</button>
  <button data-tab="set">设置</button>
</div></nav>
<div id="sheet"></div>

<script>

/* ---------- 日期 ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=()=>iso(new Date());
const WD='日一二三四五六';
const monday=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};

function day(s){
  if(!S.days[s]){
    const wd=parse(s).getDay();
    const [l,d]=WEEK_ROT[wd];
    S.days[s]={tpl:(wd===0||wd===6)?'B':'A',train:S.settings.trainDays.includes(wd),
      meals:{lunch:{src:l},dinner:{src:d}},done:{},extras:[]};
  }
  return S.days[s];
}

/* ---------- 计算 ---------- */
const clone=a=>a.map(x=>x.slice());
const food=it=>it[2]?Object.assign({unit:'g',step:10},it[2]):FOOD[it[0]];
const fmtAmt=(F,a)=>{const v=+(+a).toFixed(1);return F.unit==='g'||F.unit==='ml'?`${v}${F.unit}`:`${v} ${F.unit}`};
const NAME={bfast:'早餐',lunch:'午餐',dinner:'晚餐'},TIME={bfast:'07:30',lunch:'12:30',dinner:'19:00'};
function defMain(D,k){const m=D.meals[k];return [[m.src,m.g!=null?m.g:SRC[m.src][D.tpl]],['rice',220],['veg',200],['oil',10]]}
function getItems(D,k){if(k==='bfast')return D.bf||S.lastBf||BF_PRESETS[0].items;return D.meals[k].items||defMain(D,k)}
function setItems(D,k,it){if(k==='bfast'){D.bf=it;S.lastBf=clone(it)}else D.meals[k].items=it;save()}
function meal(D,k){
  const items=getItems(D,k),t=ZERO();
  for(const it of items){const F=food(it),a=it[1];if(!F)continue;const g=a*(F.per||1);for(const x in t)t[x]+=(F[x]||0)*g/100}
  const d=items.length?items.map(it=>{const F=food(it);return `${F.n} ${fmtAmt(F,it[1])}${F.raw?' 生':F.cooked?' 熟':''}`}).join(' · '):'还没选';
  return {n:NAME[k],time:TIME[k],d,...t};
}
function slots(D){
  const out=[];
  if(D.train)out.push(['pre',FIXED.pre]);
  out.push(['bfast',meal(D,'bfast')]);
  out.push(['lunch',meal(D,'lunch')]);
  if(D.tpl==='A')out.push(['snack',FIXED.snack]);
  out.push(['dinner',meal(D,'dinner')]);
  return out;
}
function totals(D){
  const t=ZERO(),plan={p:0,k:0};
  for(const[k,m]of slots(D)){plan.p+=m.p;plan.k+=m.k;if(D.done[k])for(const x in t)t[x]+=m[x]||0}
  for(const e of D.extras)for(const x in t)t[x]+=e[x]||0;
  return {t,plan};
}
function weights(){return Object.entries(S.days).filter(([,d])=>d.w).map(([s,d])=>[s,d.w]).sort((a,b)=>a[0]<b[0]?-1:1)}
function avg7(end){
  const from=addD(end,-6);const ws=weights().filter(([s])=>s>=from&&s<=end).map(x=>x[1]);
  return ws.length?ws.reduce((a,b)=>a+b,0)/ws.length:null;
}
function weekAvg(mon){
  const end=addD(mon,6);const ws=weights().filter(([s])=>s>=mon&&s<=end).map(x=>x[1]);
  return ws.length>=3?{a:ws.reduce((a,b)=>a+b,0)/ws.length,n:ws.length}:null;
}
function verdict(ref){
  const m0=monday(ref),m1=addD(m0,-7),m2=addD(m0,-14);
  const w0=weekAvg(m0),w1=weekAvg(m1),w2=weekAvg(m2);
  if(!w0||!w1)return{t:'数据不够',d:'每周至少 3 次晨重，连续两周后才出结论。',delta:null};
  const d0=w0.a-w1.a,d1=w2?w1.a-w2.a:null;
  const firstWeeks=weights().length&&weights()[0][0]>=addD(m0,-21);
  if(d0<-0.1)return{t:'复查饮食与是否生病',d:'均重在降。先看这周有没有漏餐、生病或活动量变大。',delta:d0};
  if(d0>0.35&&(d1==null||d1>0.35))return{t:firstWeeks?'先观察':'复查热量与腰围',d:firstWeeks?'刚恢复训练，糖原和水分会让体重先跳一下，不等于长脂肪。':'连续涨太快。量一下腰围，看看是不是加餐偏多。',delta:d0};
  if(d0<0.05&&d1!=null&&d1<0.05)return{t:'每天 +100–150 kcal',d:'两周没涨。最省事：每天加一份 +150g 米饭，或者一个香蕉加一把杏仁。',delta:d0};
  if(d0<0.05)return{t:'保持，再看一周',d:'这周没涨，下周还不涨再加饭。',delta:d0};
  return{t:'保持',d:'在目标速度内（+0.1–0.2 kg/周），照常吃。',delta:d0};
}
const e1rm=(w,r)=>w*(1+r/30);
function lastSet(id,before){for(let i=S.sessions.length-1;i>=0;i--){const ss=S.sessions[i];if(before&&ss.date>=before)continue;const x=ss.sets[id];if(x)return x}return null}
function lastUsed(ids,before){for(let i=S.sessions.length-1;i>=0;i--){const ss=S.sessions[i];if(before&&ss.date>=before)continue;for(const id of ids)if(ss.sets[id])return id}return null}
function nextDay(before){for(let i=S.sessions.length-1;i>=0;i--){const ss=S.sessions[i];if(before&&ss.date>=before)continue;if(PLAN[ss.day])return'D'+(+ss.day[1]%4+1)}return'D1'}
// Strong 动作名 → 这里的动作；没对上的按 Strong 原名单独记
const STRONG_MAP={
  'Bench Press (Dumbbell)':'d1a','Lat Pulldown (Machine)':'d1b','Lat Pulldown (Cable)':'d1b',
  'Squat (Smith Machine)':'d1c','Lateral Raise (Dumbbell)':'d1d','Triceps Extension (Cable)':'d1e',
  'Incline Bench Press (Smith Machine)':'d2a','Bent Over One Arm Row (Dumbbell)':'d2b',
  'Seated Wide-Grip Row (Cable)':'d2b_scr','Seated Row (Cable)':'d2b_scr',
  'Romanian Deadlift (Dumbbell)':'d2c','Bicep Curl (Cable)':'d2d','Bicep Curl (Dumbbell)':'d2d_db','Leg Press':'d2e_lp','Calf Press on Leg Press':'d2e',
  'Bench Press (Smith Machine)':'d3a','Lunge (Dumbbell)':'d3c','Dumbbell Step Up':'d3c',
  'Face Pull (Cable)':'d3d','Cable Crunch':'d3e',
  'Seated Overhead Press (Dumbbell)':'d4a','Lying Leg Curl (Machine)':'d4c',
  'Hammer Curl (Dumbbell)':'d4d','Triceps Pushdown (Cable - Straight Bar)':'d4e'
};
function csvRows(t){const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1)out.push(row);row=[]}
    else f+=c}
  if(f||row.length){row.push(f);if(row.length>1)out.push(row)}return out}
function importStrong(text){
  const rows=csvRows(text.replace(/^\uFEFF/,''));const hd=rows.shift()||[];const ix=n=>hd.indexOf(n);
  const iD=ix('Date'),iN=ix('Workout Name'),iE=ix('Exercise Name'),iO=ix('Set Order'),iW=ix('Weight'),iR=ix('Reps');
  if(iD<0||iE<0||iO<0||iW<0||iR<0)throw new Error('不是 Strong 导出的 CSV');
  const wk={};S.exNames=S.exNames||{};const unmapped=new Set();
  for(const r of rows){const so=r[iO];if(so==='W'||so==='D')continue;
    const w=parseFloat(r[iW])||0,rp=Math.round(parseFloat(r[iR])||0);if(!rp)continue;
    const ts=r[iD],nm=r[iE];let id=STRONG_MAP[nm];if(!id){id='sx:'+nm;S.exNames[id]=nm;unmapped.add(nm)}
    const W=(wk[ts]=wk[ts]||{ts,name:r[iN],sets:{}});(W.sets[id]=W.sets[id]||[]).push([w,rp])}
  // 每个动作：所有正式组的平均重量 × 平均次数（不只看最后一组，最后一组常常已经力竭）
  const r1=v=>Math.round(v*10)/10;
  for(const k in wk)for(const id in wk[k].sets){const a=wk[k].sets[id];wk[k].sets[id]={w:r1(a.reduce((x,y)=>x+y[0],0)/a.length),r:r1(a.reduce((x,y)=>x+y[1],0)/a.length),n:a.length,all:a}}
  for(const x of S.sessions)if(x.src==='strong'&&x.edited&&wk[x.ts])delete wk[x.ts];
  const keep=S.sessions.filter(x=>!(x.src==='strong'&&wk[x.ts]));let n=0;
  for(const k in wk){const x=wk[k];let best='S',bn=0;
    for(const d in PLAN){const c=PLAN[d].ex.filter(e=>x.sets[e[0]]||(ALT[e[0]]||[]).some(a=>x.sets[a[0]])).length;if(c>bn){bn=c;best=d}}
    keep.push({date:x.ts.slice(0,10),day:bn>=2?best:'S',name:x.name,sets:x.sets,src:'strong',ts:x.ts});n++}
  keep.sort((a,b)=>(a.date+(a.ts||''))<(b.date+(b.ts||''))?-1:1);S.sessions=keep;save();
  return {n,unmapped:[...unmapped]};
}

    <div><div class="lbl">比上周</div><div class="mid">${a7!=null&&a7p!=null?((a7-a7p>=0?'+':'')+(a7-a7p).toFixed(2)):'—'}</div></div>

function oilyWeek(s){const m=monday(s);let n=0;for(let j=0;j<7;j++){const D=S.days[addD(m,j)];if(!D)continue;
  for(const k of['lunch','dinner'])if(D.done[k]&&getItems(D,k).some(([id,a])=>id==='sal'&&a>=100))n++}return n}
function vNut(s,t){
  const fmt=v=>v>=10?f0(v):v.toFixed(1);
  const rows=NUT.map(([x,n,u,goal])=>{const v=t[x]||0,pc=Math.min(100,v/goal*100),ok=v>=goal;
    return `<div class="r ${ok?'ok':''}"><span class="nm">${n}</span><div class="bar"><i style="width:${pc}%"></i></div><span class="v num ${ok?'':'sub'}">${fmt(v)} / ${goal} ${u}</span></div>`}).join('');
  const oily=oilyWeek(s);
  return `<div class="card list nut"><div class="row between" style="margin-bottom:4px"><div class="lbl">微量营养 · NHS 参考</div><div class="sub">按勾了的餐算</div></div>${rows}
   <div class="r ${oily>=1?'ok':''}"><span class="nm">油性鱼</span><div class="bar"><i style="width:${Math.min(100,oily*100)}%"></i></div><span class="v num ${oily>=1?'':'sub'}">本周 ${oily} / 1 份</span></div>

}

      const cur=DRAFT[id]||(rec?{w:rec.w,r:rec.r,wR:rec.wR,rR:rec.rR,ok:true,saved:true}:{w:nw(last?last.w:0),r:last?(lr>=hi?lo:Math.round(last.r)):lo,ok:false});

      let up=false;
      const lastTxt=last?(uni&&last.wR!=null?`左 ${last.w}kg × ${last.r} / 右 ${last.wR}kg × ${last.rR}`:`${last.n>1?'平均 ':''}${last.w}kg × ${last.r}${last.n>1?`（${last.n} 组）`:''}`):'';
      if(last){if(lr>=hi){hint=`上次 ${lastTxt} 到上限 → 今天 +${step}kg`;up=true}else hint=`上次 ${lastTxt} → 今天争取 ${Math.min(hi,Math.floor(lr)+1)} 次`}
      if(rec){up=false;hint=`这天练的：${rec.all?rec.all.map(a=>a[0]+'×'+a[1]).join(' · ')+'（平均 '+rec.w+'kg × '+rec.r+'）':(rec.wR!=null?`左 ${rec.w}kg × ${rec.r} / 右 ${rec.wR}kg × ${rec.rR}`:rec.w+'kg × '+rec.r)}`}
      const nameH=opts.length>1?`<select class="exsel" data-slot="${base[0]}" style="font-weight:600;padding:6px 8px">${opts.map(o=>`<option value="${o[0]}" ${o[0]===id?'selected':''}>${o[1]}</option>`).join('')}</select>`:n;
      const ctl=(fw,fr,lab)=>`<div class="ctl num">${lab?`<span class="sub" style="width:16px">${lab}</span>`:''}<div class="step"><button data-a="st" data-id="${id}" data-f="${fw}" data-d="${-step}">−</button><input class="trin num" data-id="${id}" data-f="${fw}" type="number" inputmode="decimal" step="any" value="${cur[fw]}"><button data-a="st" data-id="${id}" data-f="${fw}" data-d="${step}">+</button></div>
        <span class="sub">kg</span><span class="x">×</span>
        <div class="step"><button data-a="st" data-id="${id}" data-f="${fr}" data-d="-1">−</button><input class="trin num" data-id="${id}" data-f="${fr}" type="number" inputmode="numeric" step="any" value="${cur[fr]}" style="width:54px"><button data-a="st" data-id="${id}" data-f="${fr}" data-d="1">+</button></div>
        ${fw==='w'?`<button class="chk ${cur.ok?'on':''}" data-a="exok" data-id="${id}" style="margin-left:auto"></button>`:''}</div>`;
      h+=`<div class="ex"><div class="top"><div class="name">${nameH}</div><div class="rng">${lo}–${hi} 次${uni?' · 左右各一组':''}</div></div>
        <div class="hint ${up?'up':''}">${hint}</div>
        ${uni?ctl('w','r','左')+ctl('wR','rR','右'):ctl('w','r','')}</div>`;
    }
    const extra=Object.keys(savedSets).filter(id=>!shown.has(id));
    if(extra.length){const nm=id=>{const e=ALL_EX.find(x=>x[0]===id);return e?e[1]:(S.exNames||{})[id]||id.replace(/^sx:/,'')};
      h+=`<div class="ex"><div class="lbl">这天还练了</div>${extra.map(id=>{const r=savedSets[id];return `<div class="row between" style="padding:6px 0"><span class="name">${nm(id)}</span><span class="sub num">${r.all?r.all.map(a=>a[0]+'×'+a[1]).join(' · '):r.w+'kg × '+r.r}</span></div>`}).join('')}</div>`}
    const n=Object.values(DRAFT).filter(x=>x.ok).length;
    h+=`</div><div class="sub" style="margin:-4px 2px 10px">记正式组的平均重量和平均次数（热身组不算），数字可以直接点进去输入。平均次数到区间上限，下次就加重。</div>
    ${done.some(x=>x.day===TD)&&!DIRTY
      ?`<div class="savedbox">✓ 已保存 · ${TD} · ${Object.keys(savedSets).length} 个动作</div>`
      :`<button class="solid" data-a="savesess" style="width:100%;padding:13px;${n?'':'opacity:.4'}" ${n?'':'disabled'}>${done.some(x=>x.day===TD)?'保存修改':'保存'} ${n}/${P.ex.length} 个动作</button>`}`;
  }
  const recent=S.sessions.slice(-5).reverse();
  if(recent.length)h+=`<div class="card list" style="margin-top:14px"><div class="lbl" style="margin-bottom:4px">最近</div>${recent.map(x=>`<div class="r"><span>${x.date.slice(5)} · ${PLAN[x.day]?x.day:(x.name||'其他')}${x.src==='strong'?' <span class="pill">Strong</span>':''}</span><span class="sub">${Object.keys(x.sets).length} 个动作</span></div>`).join('')}</div>`;
  return h;
}

function spark(pts,w=320,hgt=70,goalA,goalB){
  if(pts.length<2)return'<div class="sub">至少两个数据点才画线。</div>';
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  let lo=Math.min(...ys),hi=Math.max(...ys);if(hi-lo<0.6){const m=(hi+lo)/2;lo=m-.3;hi=m+.3}
  const X=i=>34+(w-44)*i/(pts.length-1),Y=v=>hgt-12-(hgt-24)*(v-lo)/(hi-lo);
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${hgt}" width="100%" height="${hgt}" preserveAspectRatio="none" style="display:block;margin-top:8px;color:var(--ink)">
   <path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
   <circle cx="${X(pts.length-1)}" cy="${Y(ys[ys.length-1])}" r="3" fill="var(--accent)"/>
   <text x="0" y="9">${hi.toFixed(1)}</text><text x="0" y="${hgt-1}">${lo.toFixed(1)}</text></svg>`;
}

function vTrend(){
  const ws=weights();
  const last=ws.length?ws[ws.length-1][0]:TODAY();
  const pts=[];for(let i=55;i>=0;i--){const s=addD(last,-i);const a=avg7(s);if(a!=null&&S.days[s]&&S.days[s].w)pts.push([s,a])}
  const v=verdict(TODAY());
  let h=`<h1>趋势</h1><div class="date">体重与力量</div>
  <div class="card verdict"><div class="lbl">本周结论</div><div class="mid" style="margin-top:4px">${v.t}</div><div class="sub" style="margin-top:4px">${v.d}</div></div>
  <div class="card"><div class="row between"><div class="lbl">7 天均重 · 8 周</div><div class="sub num">${pts.length?f1(pts[pts.length-1][1])+' kg':''}</div></div>${spark(pts)}</div>`;
  // 周表
  const m0=monday(TODAY());let rows='';
  for(let i=0;i<6;i++){const m=addD(m0,-7*i),w=weekAvg(m),p=weekAvg(addD(m,-7));
    const sess=S.sessions.filter(x=>x.date>=m&&x.date<=addD(m,6)).length;
    let pd=0,pn=0;for(let j=0;j<7;j++){const D=S.days[addD(m,j)];if(D&&Object.keys(D.done).length){pn++;if(totals(D).t.p>=130)pd++}}
    rows+=`<div class="r num"><span>${m.slice(5)} 周</span><span>${w?w.a.toFixed(1):'—'}${w&&p?` <span class="sub">${(w.a-p.a>=0?'+':'')+(w.a-p.a).toFixed(2)}</span>`:''}</span><span class="sub">练 ${sess} · 蛋白达标 ${pd}/${pn}</span></div>`}
  h+=`<div class="card list"><div class="lbl" style="margin-bottom:4px">每周</div>${rows}</div>`;
  // 力量
  let ex='';
  const since=addD(TODAY(),-120),others=[];const seen=new Set(ALL_EX.map(e=>e[0]));
  for(const x of S.sessions)if(x.date>=since)for(const id in x.sets)if(!seen.has(id)){seen.add(id);others.push([id,(S.exNames||{})[id]||id.replace(/^sx:/,'')])}
  for(const[id,n]of [...ALL_EX,...others]){
    const p=S.sessions.filter(s=>s.sets[id]).map(s=>[s.date,e1rm(s.sets[id].w,s.sets[id].r)]);
    if(!p.length)continue;
    const first=p[0][1],now=p[p.length-1][1];
    ex+=`<div class="ex"><div class="top"><div class="name">${n}</div><div class="rng num">估算 1RM ${now.toFixed(1)}kg ${p.length>1?`<b style="color:var(--ink)">${now-first>=0?'+':''}${((now/first-1)*100).toFixed(0)}%</b>`:''}</div></div>${p.length>1?spark(p,320,44):''}</div>`;
  }
  h+=`<div class="card"><div class="lbl">力量 · 估算 1RM</div>${ex||'<div class="sub" style="margin-top:6px">还没有训练记录。</div>'}</div>
  <div class="card list"><div class="lbl" style="margin-bottom:4px">停练前（杠铃，仅作参照）</div>${OLD.map(([n,w,r])=>`<div class="r num"><span>${n}</span><span class="sub">${w}kg × ${r} · 1RM ≈ ${e1rm(w,r).toFixed(0)}</span></div>`).join('')}<div class="sub" style="margin-top:6px">现在练的是史密斯和哑铃，数字不能直接比，看自己的曲线有没有往上走。</div></div>`;
  return h;
}

     <div style="flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${F.veg?`<select class="vsel" data-i="${i}" style="max-width:100%;padding:7px 6px;font-weight:600">${VEG_IDS.map(v=>`<option value="${v}" ${v===id?'selected':''} ${v!==id&&items.some(x=>x[0]===v)?'disabled':''}>${FOOD[v].n}</option>`).join('')}</select>`:F.n}${it[2]?` <span class="sub" style="font-weight:400">${it[2].est?'估算':'自定义'}</span>`:''}${F.raw?' <span class="sub" style="font-weight:400">生重</span>':F.cooked?' <span class="sub" style="font-weight:400">熟重</span>':''}</div>
     <div class="step" style="flex:0 0 auto"><button data-a="is" data-i="${i}" data-d="${-F.step}" style="padding:8px 10px">−</button>
     <input class="iin num" data-i="${i}" type="number" inputmode="decimal" step="any" value="${+(+a).toFixed(1)}" style="width:50px;border:0;border-radius:0;text-align:center;font-weight:600;padding:8px 0">
     <button data-a="is" data-i="${i}" data-d="${F.step}" style="padding:8px 10px">+</button></div>
     <span class="sub" style="flex:0 0 20px">${F.unit}</span>
     <button class="ghost" data-a="irm" data-i="${i}" aria-label="删除" style="flex:0 0 auto;padding:6px 4px">×</button></div>`}).join('')||'<div class="sub" style="margin-top:6px">还没选，点下面的食材。</div>'}
   ${k==='bfast'?chips(BF_IDS,have,'加一样'):chips(MEAT_IDS,have,'加肉 / 鱼（可以混合）')+chips(SIDE_IDS,have,'加别的')}
   ${customForm()}
   <div class="sub num" style="margin-top:12px">这一顿 ≈ 蛋白 ${f0(cur.p)}g · ${f0(cur.k)} kcal · 碳水 ${f0(cur.c)}g · 脂肪 ${f0(cur.f)}g</div>
   <div class="sub" style="margin-top:4px">${k==='bfast'?'改过的组合会记住，明天默认还是它。':'肉按生重，米饭按熟重。切换 A/B 模板会恢复成模板。'}</div>
  </div></div>`;

/* ---------- 交互 ---------- */
document.addEventListener('click',e=>{
  const nb=e.target.closest('nav button');if(nb){TAB=nb.dataset.tab;render();scrollTo(0,0);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,D=day(VIEW);
  // 点在弹层内容上（不是按钮）时，不要当成点背景关闭
  if(a==='close'&&b.classList.contains('sheet')&&e.target!==b)return;
  switch(a){
    case'ip':setItems(D,EK,clone(BF_PRESETS[+b.dataset.i].items));editItems(EK);render();return;
    case'ireset':delete D.meals[EK].items;delete D.meals[EK].g;save();editItems(EK);render();return;
    case'cform':FORM=b.dataset.v||null;editItems(EK);return;
    case'cxadd':{const n=($('#cxn').value||'').trim(),g=parseFloat($('#cxg').value);
      if(!n||!(g>0))return toast('写名称和克数');
      let o;
      if(FORM==='est'){const v=estimate(n);if(!v)return toast('认不出来，用「完全自定义」');o={n,...v,est:1}}
      else{const num=id=>parseFloat($('#'+id).value)||0;const pp=num('cxp'),cc=num('cxc'),ff=num('cxf');
        o={n,p:pp,c:cc,f:ff,k:num('cxk')||Math.round(pp*4+cc*4+ff*9),fib:num('cxfib')}}
      const it=clone(getItems(D,EK));it.push(['cx',g,o]);setItems(D,EK,it);FORM=null;editItems(EK);render();
      toast(`${n} ${g}g ≈ 蛋白 ${f0(o.p*g/100)}g · ${f0(o.k*g/100)} kcal`);return}
    case'is':{const it=clone(getItems(D,EK)),i=+b.dataset.i;it[i][1]=Math.max(0,+(it[i][1]+ +b.dataset.d).toFixed(2));setItems(D,EK,it);editItems(EK);render();return}
    case'irm':{const it=clone(getItems(D,EK));it.splice(+b.dataset.i,1);setItems(D,EK,it);editItems(EK);render();return}
    case'iadd':{const it=clone(getItems(D,EK));let id=b.dataset.v;if(id==='veg')id=VEG_IDS.find(v=>!it.some(x=>x[0]===v));let amt=FOOD[id].def;
      if(SRC[id]){amt=SRC[id][D.tpl];if(it.some(x=>SRC[x[0]]))amt=Math.round(amt/20)*10}
      it.push([id,amt]);setItems(D,EK,it);editItems(EK);render();return}
    case'prev':VIEW=addD(VIEW,-1);break;
    case'next':VIEW=addD(VIEW,1);break;
    case'today':VIEW=TODAY();break;
    case'w':{const v=parseFloat($('#w').value);if(!(v>30&&v<200))return toast('输入晨重 kg');D.w=Math.round(v*100)/100;save();toast('已记录 '+D.w+' kg');break}
    case'tpl':D.tpl=b.dataset.v;for(const k of['lunch','dinner']){delete D.meals[k].g;delete D.meals[k].items}save();break;
    case'train':D.train=!D.train;if(!D.train)delete D.done.pre;save();break;
    case'eat':D.done[b.dataset.k]=!D.done[b.dataset.k];if(!D.done[b.dataset.k])delete D.done[b.dataset.k];save();break;
    case'edit':FORM=null;editItems(b.dataset.k);return;
    case'close':$('#sheet').innerHTML='';break;
    case'addx':{const e2=[...EXTRAS,...S.custom][+b.dataset.i];D.extras.push({...e2});save();break}
    case'rmx':D.extras.splice(+b.dataset.i,1);save();break;
    case'td':TD=b.dataset.v;DRAFT=null;break;
    case'trset':D.train=b.dataset.v==='1';if(!D.train)delete D.done.pre;save();break;
    case'cal':CM=null;calSheet();return;
    case'cm':CM=b.dataset.v;calSheet();return;
    case'pick':VIEW=b.dataset.v;CM=null;DRAFT=null;$('#sheet').innerHTML='';break;
    case'st':{const x=DRAFT[b.dataset.id],f=b.dataset.f;x[f]=Math.max(0,+(x[f]+ +b.dataset.d).toFixed(2));x.ok=true;DIRTY=true;break}
    case'exok':DRAFT[b.dataset.id].ok=!DRAFT[b.dataset.id].ok;DIRTY=true;break;
    case'savesess':{const sets={};for(const id in DRAFT)if(DRAFT[id].ok){const x=DRAFT[id];sets[id]={w:x.w,r:x.r};if(UNI.has(id)&&x.wR!=null){sets[id].wR=x.wR;sets[id].rR=x.rR}}
      if(!Object.keys(sets).length)return;const dt=VIEW;const ex=S.sessions.find(x=>x.date===dt&&x.day===TD);
      if(ex){for(const id in sets){const old=ex.sets[id],nw=sets[id];const same=old&&['w','r','wR','rR'].every(f=>(old[f]??null)===(nw[f]??null));ex.sets[id]=same?old:(old&&old.all&&old.w===nw.w&&old.r===nw.r?{...nw,all:old.all,n:old.n}:nw)}
        for(const id in DRAFT)if(!DRAFT[id].ok)delete ex.sets[id];ex.edited=true}else S.sessions.push({date:dt,day:TD,sets});S.sessions.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);day(dt).train=true;save();toast(TD+' 已保存');TD=null;DRAFT=null;break}
    case'tday':{const v=+b.dataset.v,t=S.settings.trainDays;const i=t.indexOf(v);i>=0?t.splice(i,1):t.push(v);break}
    case'saveset':S.settings.prot=+$('#sp').value||140;S.settings.kcal=+$('#sk').value||2550;save();toast('已保存');break;
    case'addc':{const n=$('#cn').value.trim();if(!n)return toast('写个名称');S.custom.push({n,p:+$('#cp').value||0,k:+$('#ck').value||0,c:+$('#cc').value||0,f:+$('#cf').value||0,fib:0});save();break}
    case'rmc':S.custom.splice(+b.dataset.i,1);save();break;
    case'exp':{const bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='lean-bulk-'+TODAY()+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
    case'imp':$('#impf').click();return;
    case'simp':$('#strongf').click();return;
  }
  render();
});
document.addEventListener('change',e=>{
  if(e.target.id==='strongf'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const r=importStrong(t);render();
    toast(`导入 ${r.n} 次训练`+(r.unmapped.length?`，${r.unmapped.length} 个动作按原名单独记`:''))}catch(err){toast(err.message||'文件不对')}});return}
  if(e.target.classList.contains('exsel')){const alt=S.settings.alt||(S.settings.alt={});const slot=e.target.dataset.slot,nv=e.target.value;
    const ids=[slot,...(ALT[slot]||[]).map(a=>a[0])];let moved=false;
    for(const ss of S.sessions)if(ss.date===VIEW)for(const id of ids)if(id!==nv&&ss.sets[id]){ss.sets[nv]=ss.sets[id];delete ss.sets[id];ss.edited=true;moved=true}
    if(DRAFT)for(const id of ids)if(id!==nv&&DRAFT[id]){if(moved||!DRAFT[nv])DRAFT[nv]=DRAFT[id];delete DRAFT[id]}
    alt[slot]=nv;OVR[slot]=nv;save();if(moved)toast('这天的记录已改成 '+(ALL_EX.find(x=>x[0]===nv)||[,nv])[1]);render();return}
  if(e.target.classList.contains('trin')){const x=DRAFT&&DRAFT[e.target.dataset.id],v=parseFloat(e.target.value);if(x&&v>=0){x[e.target.dataset.f]=/^r/.test(e.target.dataset.f)?Math.round(v*10)/10:v;x.ok=true;DIRTY=true}render();return}
  if(e.target.classList.contains('vsel')){const D=day(VIEW),it=clone(getItems(D,EK));it[+e.target.dataset.i][0]=e.target.value;setItems(D,EK,it);editItems(EK);render();return}
  if(e.target.classList.contains('iin')){const D=day(VIEW),it=clone(getItems(D,EK)),v=parseFloat(e.target.value);
    if(!(v>=0))return editItems(EK);it[+e.target.dataset.i][1]=v;setItems(D,EK,it);editItems(EK);render();return}
  if(e.target.id!=='impf')return;const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const o=JSON.parse(t);if(!o.days)throw 0;if(!confirm('覆盖这台设备上的数据？'))return;S=Object.assign(load(),o);save();render();toast('已导入')}catch(_){toast('文件不对')}});
});
